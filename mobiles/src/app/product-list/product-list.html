<h2>Products</h2>

@for (product of products; track product.id) {
  <div style="margin-bottom: 20px;">
    <h3>
      <a [title]="product.name + ' details'"
         [routerLink]="['/products', product.id]"
         style="color: #1976d2; text-decoration: none; font-size: 20px;">
        {{ product.name }}
      </a>
    </h3>

    @if (product.description) {
      <p>Description: {{ product.description }}</p>
    }

    <!-- Añadimos a la pagina principal la cantidad disponible-->

      <!-- Ponemos los colores segun la cantidad que tienen-->
      <p [ngClass]="{
      'verde' : product.quantity > 5,
      'naranja' : product.quantity >= 1 && product.quantity <= 5,
      'rojo' : product.quantity === 0
      }">

       Quantity: {{ product.quantity }}
        <!-- Ponemos que si la cantidad del producto es igual a 0 salga agotado en rojo-->

        <span *ngIf="product.quantity === 0" style="color:red"> Agotado</span>
      </p>




    <button type="button" (click)="share()">
      Share
    </button>
  </div>
}
